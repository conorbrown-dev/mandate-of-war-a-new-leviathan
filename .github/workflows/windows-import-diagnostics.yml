name: Windows Godot Import Diagnostics

permissions:
  actions: read
  contents: read

on:
  push:
    branches:
      - codex/windows-demo-build
    paths:
      - .github/workflows/windows-import-diagnostics.yml
  workflow_dispatch:

jobs:
  import:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Download Godot Windows runtime
        shell: pwsh
        run: |
          $version = "4.7.2"
          $archive = Join-Path $env:RUNNER_TEMP "godot-win64.zip"
          Invoke-WebRequest -Uri "https://github.com/godotengine/godot-builds/releases/download/${version}-stable/Godot_v${version}-stable_win64.exe.zip" -OutFile $archive
          $runtimeDir = Join-Path $env:RUNNER_TEMP "godot-runtime"
          Expand-Archive -Path $archive -DestinationPath $runtimeDir -Force
          $godot = Get-ChildItem $runtimeDir -Filter "Godot_v${version}-stable_win64.exe" -Recurse | Select-Object -First 1
          if (-not $godot) { throw "Godot Windows runtime was not found in the release archive." }
          "GODOT_EXE=$($godot.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Import and inspect project resources
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $artifactRoot = Join-Path $env:RUNNER_TEMP "prior-demo-artifact"
          gh run download 42962205622 --repo conorbrown-dev/mandate-of-war-a-new-leviathan --name MandateOfWarDemo-Windows-x86_64 --dir $artifactRoot
          if ($LASTEXITCODE -ne 0) { throw "Could not download the previously compiled Windows demo artifact." }
          $archive = Get-ChildItem -Path $artifactRoot -Filter "*.zip" -Recurse | Select-Object -First 1
          if (-not $archive) { throw "The compiled Windows demo zip was not found in the downloaded artifact." }
          $package = Join-Path $env:RUNNER_TEMP "prior-demo-package"
          Expand-Archive -Path $archive.FullName -DestinationPath $package -Force
          $project = Join-Path $package "godot/project"
          if (-not (Test-Path (Join-Path $project "project.godot")) -or -not (Test-Path (Join-Path $project "bin/rts_gdextension.dll"))) { throw "The compiled project's Windows runtime files are missing." }
          Write-Host "Project path: $project"
          & (Join-Path $package "GodotRuntime.exe") --headless --editor --path $project --verbose --import
          Write-Host "Godot import exit code: $LASTEXITCODE"
          $importedDir = Join-Path $project ".godot/imported"
          Get-ChildItem -Path (Join-Path $project ".godot") -Force -Recurse | Select-Object -First 30
          $files = Get-ChildItem -Path $importedDir -File -Recurse -Force -ErrorAction SilentlyContinue
          Write-Host "Imported cache file count: $($files.Count)"
          if ($files.Count -eq 0) { throw "Godot's Windows import command produced no imported cache files." }

      - name: Upload imported asset cache
        uses: actions/upload-artifact@v4
        with:
          name: windows-import-cache
          path: ${{ runner.temp }}/prior-demo-package/godot/project/.godot/imported
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
