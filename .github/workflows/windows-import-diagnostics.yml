name: Windows Godot Import Diagnostics

on:
  push:
    branches:
      - codex/windows-demo-build
    paths:
      - .github/workflows/windows-import-diagnostics.yml
  workflow_dispatch:

jobs:
  import:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Download Godot Windows runtime
        shell: pwsh
        run: |
          $version = "4.7.2"
          $archive = Join-Path $env:RUNNER_TEMP "godot-win64.zip"
          Invoke-WebRequest -Uri "https://github.com/godotengine/godot-builds/releases/download/${version}-stable/Godot_v${version}-stable_win64.exe.zip" -OutFile $archive
          $runtimeDir = Join-Path $env:RUNNER_TEMP "godot-runtime"
          Expand-Archive -Path $archive -DestinationPath $runtimeDir -Force
          $godot = Get-ChildItem $runtimeDir -Filter "Godot_v${version}-stable_win64.exe" -Recurse | Select-Object -First 1
          if (-not $godot) { throw "Godot Windows runtime was not found in the release archive." }
          "GODOT_EXE=$($godot.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Import and inspect project resources
        shell: pwsh
        run: |
          $project = Join-Path $PWD "godot/project"
          if (-not (Test-Path (Join-Path $project "project.godot"))) { throw "The expected Godot project was not found at $project" }
          Write-Host "Project path: $project"
          & "$env:GODOT_EXE" --headless --editor --path $project --verbose --import
          if ($LASTEXITCODE -ne 0) { throw "Godot's Windows import command failed." }
          $importedDir = Join-Path $project ".godot/imported"
          Get-ChildItem -Path (Join-Path $project ".godot") -Force -Recurse
          $files = Get-ChildItem -Path $importedDir -File -Recurse -Force -ErrorAction SilentlyContinue
          Write-Host "Imported cache file count: $($files.Count)"
          if ($files.Count -eq 0) { throw "Godot's Windows import command produced no imported cache files." }

      - name: Upload imported asset cache
        uses: actions/upload-artifact@v4
        with:
          name: windows-import-cache
          path: godot/project/.godot/imported
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
